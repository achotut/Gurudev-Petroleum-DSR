<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gurudev Petroleum – Daily DSR</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,sans-serif;
  background:#eef2f5;
  margin:0;
  padding:10px;
  color:#222;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  gap:12px;
  background:#ffffff;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.logo{
  width:55px;
  height:55px;
  object-fit:contain;
}

.title h1{
  margin:0;
  font-size:22px;
}

.title p{
  margin:2px 0 0;
  color:#666;
  font-size:14px;
}

/* SECTION */

.section{
  background:#ffffff;
  padding:14px;
  margin-bottom:14px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

h2{
  margin:0 0 12px;
  font-size:22px;
}

h3{
  margin:0 0 10px;
  font-size:18px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(110px,1fr));
  gap:10px;
}

/* INPUT CARDS */

.inputCard{
  background:#ffffffaa;
  border-radius:10px;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

/* LABEL */

.inputLabel{
  font-size:13px;
  font-weight:bold;
  color:#333;
}

/* INPUT */

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #cfd4da;
  font-size:18px;
  background:#fff;
}

input:focus{
  outline:none;
  border-color:#0d6efd;
  box-shadow:0 0 0 3px #0d6efd22;
}

/* OPENING */

.opening{
  font-size:12px;
  color:#555;
  background:#ffffffbb;
  border-radius:8px;
  padding:6px;
  min-height:34px;
  line-height:1.3;
}

/* COLORS */

.ms{
  background:#e7f3ff;
}

.hsd{
  background:#e8f8f5;
}

.power{
  background:#f3e8ff;
}

.testing{
  background:#fef4e6;
}

/* BUTTON */

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  background:#0d6efd;
  color:white;
  margin-top:12px;
  cursor:pointer;
}

button:active{
  transform:scale(0.98);
}

/* READONLY */

.readonly{
  background:#f1f4f7;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  font-size:16px;
}

/* TOTAL */

.total{
  background:#d1e7dd;
  font-size:24px;
  margin-top:10px;
}

/* FINAL */

.final{
  background:#fff3cd;
  font-size:28px;
  padding:20px;
}

/* LOADER */

#loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.7);
  z-index:9999;
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(2px);
}

#loader div{
  width:55px;
  height:55px;
  border:6px solid #ddd;
  border-top:6px solid #0d6efd;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

/* MOBILE */

@media(max-width:600px){

  body{
    padding:8px;
  }

  .section{
    padding:12px;
  }

  h2{
    font-size:20px;
  }

  .grid{
    grid-template-columns:
    repeat(2,minmax(0,1fr));
  }

  input{
    font-size:17px;
    padding:11px;
  }

  button{
    position:sticky;
    bottom:10px;
    z-index:100;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }

  .final{
    font-size:26px;
  }

}

</style>
</head>

<body>

<div class="header">
  <img src="hpcl.png" alt="HPCL Logo" class="logo">
  <div class="title">
    <h1>Gurudev Petroleum</h1>
    <p>Daily Sales Register</p>
  </div>
</div>

<div id="loader"><div></div></div>

<div class="section">
  <h2>Date</h2>
  <input type="date" id="date" onchange="loadYesterday()">
</div>

<div class="section">

<h2>Fuel Readings</h2>

<div class="section ms">
  <h3>MS</h3>
  <div class="grid" id="msInputs"></div>
</div>

<div class="section hsd">
  <h3>HSD</h3>
  <div class="grid" id="hsdInputs"></div>
</div>

<div class="section power">
  <h3>Power</h3>
  <div class="grid" id="powerInputs"></div>
</div>

<div class="section testing">
  <h3>Testing</h3>
  <div class="grid" id="testingInputs"></div>
</div>

<button onclick="submitFuel()">Calculate Sale</button>

</div>

<div class="section">

<h2>Sale Breakup</h2>

<div class="grid">
  <div class="readonly" id="msSale">MS —</div>
  <div class="readonly" id="hsdSale">HSD —</div>
  <div class="readonly" id="powerSale">Power —</div>
</div>

<div class="readonly total" id="totalSale">
  Total Sale ₹ —
</div>

</div>

<div class="section">

<h2>Payments & Expenses</h2>

<div class="grid" id="paymentInputs"></div>

<button onclick="submitPaymentsOnly()">
  Calculate Final Hisab
</button>

</div>

<div class="section">

<h2>Final Hisab</h2>

<div class="readonly final" id="finalHisab">
₹ —
</div>

</div>

<script>

const apiURL =
"https://script.google.com/macros/s/AKfycbzbQeGgq1drS2qg2VO5OD6kwiiC1BMkroVrY04e4Mu9A2EWyId6ca-X21s1ty68GgFj3A/exec";

// =====================================
// LABELS
// =====================================

const msLabels = [
 "MS1","MS3","MS5","MS7",
 "MS10","MS12","MS13","MS15"
];

const hsdLabels = [
 "HSD2","HSD4","HSD6","HSD8"
];

const powerLabels = [
 "Power9","Power11","Power14","Power16"
];

const testLabels = [
 "MS","HSD","Power"
];

// MUST BE 19
const paymentLabels = [
 "Online Trf",
 "Paytm",
 "317cash1",
 "317cash2",
 "edfs1",
 "edfs2",
 "Sai Enterprises",
 "Pyramid",
 "Advances",
 "Salary",
 "Commision",
 "Expenses",
 "Tanker Diesel",
 "Tanker Bhatta",
 "Tanker Exp",
 "HP Pay",
 "Density",
 "Sumit",
 "Coin"
];

// =====================================
// CREATE INPUTS
// =====================================

function createInputs(container, labels, prefix){

 labels.forEach(label=>{

  // Outer wrapper
 const wrapper=document.createElement("div");
wrapper.className="inputCard";

  wrapper.style.display="flex";
  wrapper.style.flexDirection="column";
  wrapper.style.gap="4px";

  // Label
  const title=document.createElement("div");

  title.innerText=label;

 title.className="inputLabel";

  // Input
  const input=document.createElement("input");

  input.type="text";
  input.inputMode="decimal";

  input.placeholder=label;

  input.id=prefix+label;

  // Yesterday text
  const yesterday=document.createElement("div");

  yesterday.id="y_"+prefix+label;
yesterday.className="opening";

  // Auto next
  input.addEventListener("keydown",e=>{

   if(e.key==="Enter"){

    e.preventDefault();

    const all=[
      ...document.querySelectorAll("input[type=text]")
    ];

    const index=all.indexOf(e.target);

    if(index>-1 && index<all.length-1){

      all[index+1].focus();
    }
   }
  });

  wrapper.appendChild(title);

  wrapper.appendChild(input);

  wrapper.appendChild(yesterday);

  container.appendChild(wrapper);

 });

}

// =====================================
// CREATE ALL INPUTS
// =====================================

createInputs(
 document.getElementById("msInputs"),
 msLabels,
 "f"
);

createInputs(
 document.getElementById("hsdInputs"),
 hsdLabels,
 "f"
);

createInputs(
 document.getElementById("powerInputs"),
 powerLabels,
 "f"
);

createInputs(
 document.getElementById("testingInputs"),
 testLabels,
 "f"
);

createInputs(
 document.getElementById("paymentInputs"),
 paymentLabels,
 "p"
);

// =====================================
// ORDER
// =====================================

const fuelOrder=[
 ...msLabels,
 ...hsdLabels,
 ...powerLabels,
 ...testLabels
];

// =====================================
// LOADER
// =====================================

function showLoader(){
 document.getElementById("loader").style.display="flex";
}

function hideLoader(){
 document.getElementById("loader").style.display="none";
}

// =====================================
// LOAD YESTERDAY
// =====================================

function loadYesterday(){

 const selectedDate =
  document.getElementById("date").value;

 if(!selectedDate) return;

 showLoader();

 fetch(apiURL,{

  method:"POST",

  body:JSON.stringify({
   mode:"yesterday",
   date:selectedDate
  })

 })

 .then(r=>r.json())

 .then(d=>{

  hideLoader();

  if(!d.yesterday){

  alert("Please enter yesterday's data first.");

  document.getElementById("date").value = "";

  return;
}

  // =====================
  // MS
  // =====================

  msLabels.forEach((label,i)=>{

   const el =
    document.getElementById("y_f"+label);

   if(el){

    el.innerHTML =
     d.yesterday.ms[i]
      ? `Opening<br>${d.yesterday.ms[i]}`
      : "";
   }

  });

  // =====================
  // HSD
  // =====================

  hsdLabels.forEach((label,i)=>{

   const el =
    document.getElementById("y_f"+label);

   if(el){

    el.innerHTML =
     d.yesterday.hsd[i]
      ? `Opening<br>${d.yesterday.hsd[i]}`
      : "";
   }

  });

  // =====================
  // POWER
  // =====================

  powerLabels.forEach((label,i)=>{

   const el =
    document.getElementById("y_f"+label);

   if(el){

    el.innerHTML =
     d.yesterday.power[i]
      ? `Opening<br>${d.yesterday.power[i]}`
      : "";
   }

  });

  // =====================
  // TESTING
  // =====================

  testLabels.forEach((label,i)=>{

   const el =
    document.getElementById("y_f"+label);

   if(el){

    el.innerHTML =
     d.yesterday.test[i]
      ? `Yesterday<br>${d.yesterday.test[i]}`
      : "";
   }

  });

 })

 .catch(err=>{

  hideLoader();

  console.error(err);

 });

}

// =====================================
// SUBMIT FUEL
// =====================================

function submitFuel(){

 if(!date.value){
  alert("Please select date");
  return;
 }

 const values=fuelOrder.map(
  l=>Number(document.getElementById("f"+l).value)||0
 );

 showLoader();

 fetch(apiURL,{

  method:"POST",

  body:JSON.stringify({
   date:date.value,
   block1:values
  })

 })

 .then(r=>r.json())

 .then(d=>{

  hideLoader();
if(d.missingYesterday){

 alert("Please enter yesterday's data first");

 return;
}
if(!d.yesterday) return;
  if(d.error){
   alert(d.error);
   return;
  }

  const [
   msQty,
   hsdQty,
   powerQty,
   msRate,
   hsdRate,
   powerRate
  ] = d.fuelBlock;

  msSale.innerText =
   `MS: ${msQty} × ₹${msRate} = ₹${(msQty*msRate).toFixed(2)}`;

  hsdSale.innerText =
   `HSD: ${hsdQty} × ₹${hsdRate} = ₹${(hsdQty*hsdRate).toFixed(2)}`;

  powerSale.innerText =
   `Power: ${powerQty} × ₹${powerRate} = ₹${(powerQty*powerRate).toFixed(2)}`;

  totalSale.innerText =
   `Total Sale ₹ ${d.totalSale}`;

 })

 .catch(err=>{

  hideLoader();

  alert("Backend not reachable");

  console.log(err);

 });

}

// =====================================
// SUBMIT PAYMENTS
// =====================================

function submitPaymentsOnly(){

 if(!date.value){
  alert("Please select date");
  return;
 }

 const values=paymentLabels.map(
  l=>Number(document.getElementById("p"+l).value)||0
 );

 showLoader();

 fetch(apiURL,{

  method:"POST",

  body:JSON.stringify({
   date:date.value,
   block2:values
  })

 })

 .then(r=>r.json())

 .then(d=>{

  hideLoader();

  if(d.error){
   alert(d.error);
   return;
  }

  finalHisab.innerText =
   `₹ ${d.finalHisab}`;

 })

 .catch(err=>{

  hideLoader();

  alert("Backend not reachable");

  console.log(err);

 });

}

</script>

</body>
</html>
